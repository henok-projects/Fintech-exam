spring.application.name=jwt-auth-sample
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/exam}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA configuration. schema.sql owns the database schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=never

# Logging
logging.level.root=INFO
logging.level.com.digital.savings.wallet=INFO

# Set JWT_SECRET in each deployed environment. The fallback is for local development only.
jwt.secret=${JWT_SECRET:local-development-secret-change-before-production-2026}
jwt.expiration=PT1H
jwt.issuer=https://digital-savings-wallet.local

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true

